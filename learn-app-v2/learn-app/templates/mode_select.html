{% extends "base.html" %}
{% block title %}Choose Your Mode — LEARN{% endblock %}
{% block content %}
<div class="mode-select-page">
  <div class="mode-select-inner">
    <h1 class="fade-up">How do you want to<br>use LEARN today?</h1>
    <p class="fade-up fade-up-1">You can always switch modes from the top navigation bar.</p>

    <form method="POST">
      <div class="mode-cards fade-up fade-up-2">
        <button type="submit" name="mode" value="learn" class="mode-card learn" style="text-align:left;cursor:pointer;font-family:inherit;">
          <div class="mode-card-icon">🎓</div>
          <div class="mode-card-title">Learn Mode</div>
          <div class="mode-card-desc">Browse domains, explore topics, and discover how concepts power the real world. Upvote, comment, and save your favorites.</div>
          <div style="margin-top:20px;display:inline-flex;align-items:center;gap:6px;color:var(--accent);font-size:0.85rem;font-weight:600;">
            Start exploring →
          </div>
        </button>

        <button type="submit" name="mode" value="teach" class="mode-card teach" style="text-align:left;cursor:pointer;font-family:inherit;">
          <div class="mode-card-icon">🧑‍🏫</div>
          <div class="mode-card-title">Teach Mode</div>
          <div class="mode-card-desc">Share your knowledge by submitting real-world applications of concepts. Add images, videos, and references to help others learn.</div>
          <div style="margin-top:20px;display:inline-flex;align-items:center;gap:6px;color:var(--green);font-size:0.85rem;font-weight:600;">
            Start contributing →
          </div>
        </button>
      </div>
    </form>

    {% if current_user.mode %}
    <div style="margin-top:24px;">
      <a href="{{ url_for('main.domains') }}" class="btn btn-ghost btn-sm">← Back to platform</a>
    </div>
    {% endif %}
  </div>
</div>
{% endblock %}
