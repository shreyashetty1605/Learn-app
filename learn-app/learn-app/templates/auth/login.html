{% extends "base.html" %}
{% block title %}Sign In — LEARN{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-card fade-up">
    <div class="auth-logo">
      <span class="logo-mark">L</span>EARN
    </div>
    <h1 style="font-size:1.6rem;margin-bottom:6px;">Welcome back</h1>
    <p class="text-secondary mb-24" style="font-size:0.9rem;">Sign in to continue your learning journey.</p>

    <form method="POST">
      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-input" placeholder="you@example.com" required autofocus>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-input" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;border-radius:var(--radius-sm);padding:12px;">
        Sign in →
      </button>
    </form>

    <p style="text-align:center;margin-top:24px;font-size:0.875rem;color:var(--text-secondary);">
      Don't have an account? <a href="{{ url_for('auth.register') }}" style="color:var(--accent);font-weight:600;">Sign up free</a>
    </p>

    <div style="margin-top:20px;padding-top:20px;border-top:1px solid var(--border);font-size:0.78rem;color:var(--text-muted);text-align:center;">
      Demo: <strong>admin@learn.com</strong> / <strong>admin123</strong>
    </div>
  </div>
</div>
{% endblock %}
