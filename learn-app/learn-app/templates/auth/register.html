{% extends "base.html" %}
{% block title %}Create Account — LEARN{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-card fade-up">
    <div class="auth-logo">
      <span class="logo-mark">L</span>EARN
    </div>
    <h1 style="font-size:1.6rem;margin-bottom:6px;">Create your account</h1>
    <p class="text-secondary mb-24" style="font-size:0.9rem;">Join a community of curious learners and contributors.</p>

    <form method="POST">
      <div class="form-group">
        <label class="form-label">Full Name</label>
        <input type="text" name="name" class="form-input" placeholder="Jane Smith" required autofocus>
      </div>
      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-input" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-input" placeholder="Min. 6 characters" required>
      </div>
      <div class="form-group">
        <label class="form-label">Confirm Password</label>
        <input type="password" name="confirm_password" class="form-input" placeholder="Repeat password" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;border-radius:var(--radius-sm);padding:12px;">
        Create account →
      </button>
    </form>

    <p style="text-align:center;margin-top:24px;font-size:0.875rem;color:var(--text-secondary);">
      Already have an account? <a href="{{ url_for('auth.login') }}" style="color:var(--accent);font-weight:600;">Sign in</a>
    </p>
  </div>
</div>
{% endblock %}
